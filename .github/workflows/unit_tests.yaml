name: Unit tests

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.0.0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
        id: go
      - name: Go mod verify
        run: go mod verify

      - name: Go vet
        run: go vet ./...

      # Unit tests need no Google credentials: the acceptance tests that do
      # skip themselves unless TF_ACC is set, so no Vault step here.
      - name: Run unit tests
        run: make test
